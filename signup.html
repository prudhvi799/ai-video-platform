<!DOCTYPE html>
<html>

  <head>
    <title>Sign Up — VideoAI</title>
    <link rel="stylesheet" href="auth.css">
  </head>

  <body>

    <!-- NAVIGATION -->
    <nav>
      <h2>VideoAI</h2>
      <a href="index.html">← Back to Home</a>
    </nav>

    <!-- SIGNUP FORM -->
    <div class="auth-container">

      <div class="auth-card">

        <div class="auth-header">
          <h1>Create Account</h1>
          <p>Join thousands of creators using VideoAI</p>
        </div>

        <div class="auth-body">

          <div class="input-group">
            <label>Full Name</label>
            <input type="text" id="signupName" placeholder="Your full name">
          </div>

          <div class="input-group">
            <label>Email Address</label>
            <input type="email" id="signupEmail" placeholder="you@example.com">
          </div>

          <div class="input-group">
            <label>Password</label>
            <input type="password" id="signupPassword" placeholder="Create a password">
          </div>

          <div class="input-group">
            <label>Confirm Password</label>
            <input type="password" id="signupConfirm" placeholder="Repeat your password">
          </div>

          <button id="signupBtn">Create Free Account</button>

          <div class="error-message" id="signupError"></div>

          <div class="switch-auth">
            <p>Already have an account? <a href="login.html">Login</a></p>
          </div>

        </div>

      </div>

    </div>

    <script src="auth.js"></script>

  </body>

</html>
